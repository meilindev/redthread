<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found | Red Thread</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --kcl-red: #d4425f;
            --kcl-red-deep: #9b1b30;
            --china-gold: #c9a86a;
            --bg: #07080c;
            --text: #eceaf0;
            --muted: #9b9aa8;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: white;
            text-align: center;
            padding: 6rem 1.5rem;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% -10%, #241019 0%, var(--bg) 55%);
        }

        .hero canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.9;
        }

        .hero-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .hero-glow.g1 {
            width: 460px; height: 460px;
            background: rgba(155,27,48,0.30);
            top: -120px; left: -140px;
        }

        .hero-glow.g2 {
            width: 340px; height: 340px;
            background: rgba(212,175,55,0.10);
            bottom: -160px; right: -120px;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        .wordmark {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(1rem, 2vw, 1.25rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(5rem, 18vw, 9rem);
            line-height: 1;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, var(--china-gold) 0%, var(--kcl-red) 50%, var(--china-gold) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 6s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .message {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            letter-spacing: -0.01em;
            margin-bottom: 0.9rem;
        }

        .submessage {
            font-size: 1.1rem;
            color: var(--muted);
            max-width: 460px;
            margin: 0 auto 2rem;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            position: relative;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            background: linear-gradient(120deg, var(--kcl-red-deep), var(--kcl-red));
            color: #fff;
            padding: 1rem 2.1rem;
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 8px 30px rgba(155,27,48,0.35);
            will-change: transform;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(120deg, var(--kcl-red), #e85a75);
            box-shadow: 0 14px 40px rgba(212,66,95,0.45);
        }
    </style>
</head>
<body>

<header class="hero">
    <canvas id="network"></canvas>
    <div class="hero-glow g1"></div>
    <div class="hero-glow g2"></div>
    <div class="content">
        <div class="wordmark">Red Thread</div>
        <div class="error-code">404</div>
        <div class="message">This page has wandered off the thread.</div>
        <p class="submessage">The page you're looking for doesn't exist, or it may have moved. Let's get you back on track.</p>
        <a href="/" class="btn">← Back to Home</a>
    </div>
</header>

<script>
    // Magnetic button: pull toward the cursor on hover
    (function () {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;
        const strength = 0.35;
        const maxPull = 10;

        document.querySelectorAll('.btn').forEach(el => {
            el.addEventListener('mousemove', (e) => {
                const r = el.getBoundingClientRect();
                const x = e.clientX - (r.left + r.width / 2);
                const y = e.clientY - (r.top + r.height / 2);
                const dx = Math.max(-maxPull, Math.min(maxPull, x * strength));
                const dy = Math.max(-maxPull, Math.min(maxPull, y * strength));
                el.style.transform = `translate(${dx}px, ${dy}px) translateY(-3px)`;
            });
            el.addEventListener('mouseleave', () => {
                el.style.transform = '';
            });
        });
    })();

    // Lightweight animated particle network, matching the homepage hero
    (function () {
        const canvas = document.getElementById('network');
        const ctx = canvas.getContext('2d');
        let w, h, nodes;
        const NODE_COUNT = 46;
        const LINK_DIST = 130;

        function resize() {
            w = canvas.width = canvas.offsetWidth;
            h = canvas.height = canvas.offsetHeight;
        }

        function makeNodes() {
            nodes = Array.from({ length: NODE_COUNT }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35
            }));
        }

        function tick() {
            ctx.clearRect(0, 0, w, h);
            for (const n of nodes) {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > w) n.vx *= -1;
                if (n.y < 0 || n.y > h) n.vy *= -1;
            }
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i], b = nodes[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < LINK_DIST) {
                        ctx.strokeStyle = `rgba(176,32,52,${0.42 * (1 - dist / LINK_DIST)})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }
            for (const n of nodes) {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 1.6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(198,42,64,0.8)';
                ctx.fill();
            }
            requestAnimationFrame(tick);
        }

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.addEventListener('resize', () => { resize(); makeNodes(); });
        resize();
        makeNodes();
        if (!reduceMotion) requestAnimationFrame(tick);
    })();
</script>

</body>
</html>
